<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECO RUN</title>
<style>:root{color-scheme:dark;font-family:system-ui,'Malgun Gothic',sans-serif;background:#10191e;color:#f3f7f8}*{box-sizing:border-box}body{max-width:850px;margin:auto;padding:24px 16px}h1{font-size:26px}h1 span{color:#d4f878}p,small{color:#b3c3cb;line-height:1.6}nav{display:flex;gap:6px;margin:24px 0}button,select,input{font:inherit;min-height:46px;border-radius:10px;border:1px solid #43545e;padding:10px;background:#273740;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}nav button{flex:1;padding:10px 2px}button[aria-pressed=true],.primary{background:#d4f878;color:#14201b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}section{background:#19282f;border-radius:22px;padding:24px}.timer{text-align:center}.ring{border:6px solid #526c54;border-radius:50%;aspect-ratio:1;max-width:260px;margin:24px auto;display:flex;flex-direction:column;justify-content:center}#phase{font-size:22px;color:#aee5f4}#time{font-size:58px;font-weight:bold;font-variant-numeric:tabular-nums}#next{margin:20px 0}.controls{display:flex;gap:10px}.controls button:first-child{flex:1}progress{width:100%;accent-color:#d4f878;margin:12px 0}ol{padding:0;list-style:none}li{padding:12px;border:1px solid transparent;border-radius:8px;display:flex;justify-content:space-between;gap:8px}li.active{border-color:#d4f878;color:#d4f878}.settings label{display:flex;align-items:center;gap:12px;margin:12px 0}.settings input{min-height:24px;width:24px;accent-color:#d4f878}dialog{background:#19282f;color:#fff;width:min(520px,94%);border:1px solid #43545e;border-radius:16px}dialog::backdrop{background:#000b}.row{display:flex;gap:6px;margin:8px 0}.row select{min-width:0;flex:1}.row input{width:75px}.row button{padding:6px}#speedInput{width:90px}footer{text-align:center;margin:24px;color:#b3c3cb}@media(max-width:650px){.grid{grid-template-columns:1fr}section{padding:20px}}button:focus-visible{outline:3px solid #8ed9f1}</style>
<h1>ECO<span>RUN</span></h1><p>나의 속도로, 다시. · 6 WEEK RESET</p><nav id="weeks" aria-label="주차 선택"></nav>
<div class="grid"><section class="timer"><div id="status">시작할 준비</div><div class="ring"><span id="phase" aria-live="polite"></span><div id="time" role="timer"></div><small id="count"></small></div><p>러닝 기준 <strong id="speed"></strong> km/h</p><div id="next"></div><div class="controls"><button id="toggle" class="primary">러닝 시작</button><button id="reset">초기화</button></div><progress id="progress" max="1" value="0" aria-label="전체 진행"></progress><small id="elapsed"></small><p>속도보다 오래 남는 건, 완급이다.</p></section>
<section><h2>오늘의 플랜</h2><p id="summary"></p><ol id="list"></ol><button id="edit">계획 편집</button><div class="settings"><label><input type="checkbox" id="chime" checked>구간 전환 알림음</label><label><input type="checkbox" id="voice">한국어 음성 안내</label></div><small>웜업·쿨다운은 걷기입니다. 속도는 러닝머신에서 직접 조절하세요. 화면 잠금·백그라운드에서는 알림이 제한될 수 있으니 화면을 켜두세요. 새로고침하면 타이머는 초기화됩니다.</small><p id="feedback" role="status"></p></section></div>
<dialog id="editor"><form id="form"><h2>계획 편집</h2><label>러닝 속도 <input type="number" id="speedInput" min="0.5" max="25" step="0.1" required> km/h</label><div id="rows"></div><button type="button" id="add">구간 추가</button><p>구간 시간은 분 단위입니다. 저장하면 타이머가 초기화됩니다.</p><button type="button" id="restore">이 주차 기본값</button><button type="button" id="close">닫기</button><button class="primary">저장</button><p id="error" role="alert"></p></form></dialog><footer>꾸준히, 편안하게. 오늘도 나의 페이스.</footer>
<script>
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x)),names={run:'달리기',walk:'걷기',warmup:'웜업 걷기',cooldown:'쿨다운 걷기'},KEY='eco-run-plan-v2';
const core=[ [['run',10],['walk',2],['run',10],['walk',2],['run',10],['walk',2]], [['run',12],['walk',2],['run',12],['walk',2],['run',6]], [['run',15],['walk',2],['run',15]], [['run',20],['walk',2],['run',10]], [['run',25],['walk',2],['run',5]], [['run',30]] ];
const defaults=core.map((x,i)=>({name:`${i+1}주차`,speed:6,intervals:[['warmup',5],...x,['cooldown',5]]}));
function valid(p){return Array.isArray(p)&&p.length===6&&p.every(w=>Number.isFinite(w.speed)&&w.speed>=.5&&w.speed<=25&&Array.isArray(w.intervals)&&w.intervals.length>0&&w.intervals.length<=32&&w.intervals.every(x=>Array.isArray(x)&&Object.hasOwn(names,x[0])&&Number.isFinite(x[1])&&x[1]>=.1&&x[1]<=120));}
let plan=clone(defaults);try{let p=JSON.parse(localStorage.getItem(KEY));if(valid(p))plan=p;else{p=JSON.parse(localStorage.getItem('eco-run-plan-v1'));if(valid(p)){plan=p.map(w=>({...w,intervals:[['warmup',5],...w.intervals,['cooldown',5]]}));localStorage.setItem(KEY,JSON.stringify(plan));}}}catch{}
let week=0,saved=0,started=null,last=0,complete=false,audio,wake;
const total=()=>plan[week].intervals.reduce((s,x)=>s+x[1]*60000,0),elapsed=()=>Math.min(total(),saved+(started===null?0:Math.max(0,Date.now()-started)));
const clock=ms=>{let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function cancel(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function cue(text){if($('chime').checked&&audio){try{let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=740;g.gain.setValueAtTime(.15,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.45);o.start();o.stop(audio.currentTime+.5)}catch{}}if($('voice').checked&&'speechSynthesis'in window){cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';speechSynthesis.speak(u)}}
async function keepAwake(){if('wakeLock'in navigator&&started!==null&&document.visibilityState==='visible')try{wake=await navigator.wakeLock.request('screen')}catch{}}
function release(){if(wake){wake.release().catch(()=>{});wake=null}}
function build(){ $('weeks').replaceChildren();plan.forEach((w,i)=>{let b=document.createElement('button');b.textContent=`${i+1}주차`;b.setAttribute('aria-pressed',week===i);b.disabled=started!==null;b.onclick=()=>{week=i;reset()};$('weeks').append(b)});$('list').replaceChildren();plan[week].intervals.forEach(([k,m],i)=>{let li=document.createElement('li');li.textContent=`${i+1}. ${names[k]}`;let span=document.createElement('span');span.textContent=`${m}분`;li.append(span);$('list').append(li)});$('summary').textContent=`${week+1}주차 · 총 ${total()/60000}분`;$('speed').textContent=plan[week].speed.toFixed(1)}
function render(){let e=elapsed(),remaining=e,i=0,a=plan[week].intervals;while(i<a.length-1&&remaining>=a[i][1]*60000){remaining-=a[i][1]*60000;i++}let done=e>=total();if(done&&!complete){complete=true;saved=total();started=null;release();cue('훈련 완료. 수고하셨습니다.');build()}else if(i!==last&&!done)cue(`${names[a[i][0]]} ${a[i][1]}분 시작합니다`);last=i;$('phase').textContent=done?'훈련 완료':names[a[i][0]];$('time').textContent=clock(done?0:a[i][1]*60000-remaining);$('count').textContent=`${i+1} / ${a.length} 구간`;$('next').textContent=done?'모든 구간을 마쳤어요':a[i+1]?`다음: ${names[a[i+1][0]]} · ${a[i+1][1]}분`:'다음: 훈련 완료';$('status').textContent=done?'수고했어요':started!==null?'진행 중':e?'일시정지':'시작할 준비';$('toggle').textContent=done?'다시 시작':started!==null?'일시정지':e?'이어서 달리기':'러닝 시작';$('elapsed').textContent=`${clock(e)} / ${clock(total())}`;$('progress').value=e/total();$('edit').disabled=started!==null;[...$('list').children].forEach((li,j)=>li.classList.toggle('active',!done&&i===j))}
function reset(){saved=0;started=null;last=0;complete=false;cancel();release();build();render()}
$('toggle').onclick=()=>{if(started!==null){saved=elapsed();started=null;cancel();release()}else{if(complete)reset();if($('chime').checked)try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{})}catch{$('feedback').textContent='알림음을 지원하지 않는 브라우저입니다.'}started=Date.now();keepAwake();cue(`${names[plan[week].intervals[last][0]]} 시작합니다`)}build();render()};$('reset').onclick=reset;$('voice').onchange=()=>{if(!$('voice').checked)cancel()};if(!('speechSynthesis'in window))$('voice').disabled=true;
function row(k='run',m=5){let r=document.createElement('div');r.className='row';let s=document.createElement('select');s.setAttribute('aria-label','구간 종류');Object.entries(names).forEach(([v,n])=>{let o=document.createElement('option');o.value=v;o.textContent=n;s.append(o)});s.value=k;let input=document.createElement('input');Object.assign(input,{type:'number',min:'.1',max:'120',step:'.1',required:true,value:m});input.setAttribute('aria-label','시간 (분)');let b=document.createElement('button');b.type='button';b.textContent='삭제';b.onclick=()=>r.remove();r.append(s,input,b);$('rows').append(r)}
function fill(w){$('rows').replaceChildren();w.intervals.forEach(x=>row(...x));$('speedInput').value=w.speed;$('error').textContent=''}
$('edit').onclick=()=>{fill(plan[week]);$('editor').showModal()};$('close').onclick=()=>$('editor').close();$('restore').onclick=()=>fill(defaults[week]);$('add').onclick=()=>{if($('rows').children.length<32)row()};$('form').onsubmit=e=>{e.preventDefault();let p=clone(plan);p[week].speed=Number($('speedInput').value);p[week].intervals=[...$('rows').children].map(r=>[r.querySelector('select').value,Number(r.querySelector('input').value)]);if(!valid(p)){$('error').textContent='최소 한 구간과 유효한 시간을 입력하세요.';return}plan=p;try{localStorage.setItem(KEY,JSON.stringify(plan));$('feedback').textContent='계획을 이 브라우저에 저장했어요.'}catch{$('feedback').textContent='계획을 적용했지만 영구 저장은 불가합니다.'}$('editor').close();reset()};document.addEventListener('visibilitychange',()=>{render();keepAwake()});build();render();setInterval(render,200);
</script></html>
